<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'none';">
    <title>殺音マドカ オフィシャルサイト</title>
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <link rel="stylesheet" href="css/header.css" type="text/css">
    <link rel="stylesheet" href="css/footer.css" type="text/css">
    <link rel="stylesheet" href="css/faq.css" type="text/css">
    <link rel="icon" href="img/favicon.png">
    <script src="library/p5.min.js"></script>
    <script src="js/header.js"></script>
    <script src="js/bg.js"></script>
    <script src="js/toUp.js"></script>
    <script src="js/urlFilter.js"></script>
    <script src="js/footer.js" defer></script>
</head>
<body>
<div class="container top-content">
    <p>
        <span class="jp">よくある質問</span><span class="en">FAQ</span>
    </p>
</div>
<div class="container main-content">
    <div class="FAQ_container">
        <label>
            <input type="checkbox">
            <div class="question">
                <span class="open"></span>
                <span class="question_sentence">一部のURLに飛んだ際に「404 Not Found」とでます。なぜでしょうか？</span>
            </div>
        </label>
        <div class="answer">
            <div class="answer_sentence">
                <h3>サイトが作り終わっていないためです。</h3>
                <p>こちらの不手際でご迷惑をおかけしてしまい、</p>
                <p>大変申し訳ありません。</p>
                <p>念の為、URLを打ち間違えていないか確認していただければ幸いです。</p>
            </div>
        </div>
    </div>
    <div class="FAQ_container">
        <label>
            <input type="checkbox">
            <div class="question">
                <span class="open"></span>
                <span class="question_sentence">進捗どうですか？</span>
            </div>
        </label>
        <div class="answer">
            <div class="answer_sentence">
                <p>大変申し訳ありませんが鋭意制作中です。</p>
                <h3>頑張ります。</h3>
            </div>
        </div>
    </div>
</div>
</body>
</html>
